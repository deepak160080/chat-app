name: virtualhelp_chat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  google_fonts: ^6.2.1
  firebase_auth: ^5.3.1
  change_app_package_name: ^1.4.0
  hexcolor: ^3.0.1
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  random_avatar: ^0.0.8
  intl: ^0.19.0
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.3.2
  firebase_pagination: ^4.0.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.1.2
  intl_phone_field: ^3.2.0
  get: ^4.6.6
  file_picker: ^8.1.2
  firebase_storage: ^12.3.3
  image_picker: ^1.1.2
  flutter_chat_ui: ^1.6.15
  flutter_chat_types: ^3.6.2
  uuid: ^4.5.1
  path_provider: ^2.1.4
  open_file: ^3.5.8
  http: ^1.2.2
  flutter_firebase_chat_core: ^1.6.8
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  url_launcher: ^6.3.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  shimmer: ^3.0.0
  rename_app: ^1.6.1
  image: ^4.3.0
  provider: ^6.1.2
  image_cropper: ^8.0.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/bg.png